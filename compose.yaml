services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opspilot
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://opspilot:opspilot@db:5432/opspilot
      CORS_ORIGINS: http://localhost:3000
      INVESTIGATION_MODE: ${INVESTIGATION_MODE:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AUTH_SECRET: ${AUTH_SECRET:-local-compose-secret-change-before-deploying}
      AUTO_CREATE_SCHEMA: "false"
    ports:
      - "8000:8000"
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 15

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://opspilot:opspilot@db:5432/opspilot
      INVESTIGATION_MODE: ${INVESTIGATION_MODE:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AUTH_SECRET: ${AUTH_SECRET:-local-compose-secret-change-before-deploying}
      AUTO_CREATE_SCHEMA: "false"
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
